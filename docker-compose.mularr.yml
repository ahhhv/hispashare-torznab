# Pila completa con Mularr: hispashare-torznab + Mularr (aMule integrado) + Prowlarr + Sonarr + Radarr + Jellyfin
#
#   cp .env.example .env   # rellena HISPASHARE_TOKEN, TORZNAB_APIKEY, MULARR_PASSWORD y rutas
#   mkdir -p data/{mularr,downloads/temp,downloads/sonarr,downloads/radarr,prowlarr,sonarr,radarr,jellyfin}
#   docker compose -f docker-compose.mularr.yml up -d
#
# Puertos: Jellyfin 8096 · Prowlarr 9696 · Sonarr 8989 · Radarr 7878 · Mularr 8940 · Torznab 9118
#
# Rutas: Mularr (con su aMule integrado), Sonarr y Radarr ven las descargas en /downloads,
# así Sonarr/Radarr pueden importar sin «Remote Path Mappings».
# Las bibliotecas van en MEDIA_TV y MEDIA_MOVIES (.env).

x-common: &common
  restart: unless-stopped
  environment: &common-env
    PUID: ${PUID:-1000}
    PGID: ${PGID:-1000}
    TZ: ${TZ:-Europe/Madrid}

services:
  hispashare-torznab:
    # Imagen publicada (arm64/amd64). Para compilarla tú, comenta «image» y descomenta «build».
    image: ghcr.io/ahhhv/hispashare-torznab:latest
    # build: .
    container_name: hispashare-torznab
    restart: unless-stopped
    environment:
      HISPASHARE_TOKEN: ${HISPASHARE_TOKEN:?Falta HISPASHARE_TOKEN en .env}
      TORZNAB_APIKEY: ${TORZNAB_APIKEY:?Falta TORZNAB_APIKEY en .env}
      HISPASHARE_API_URL: ${HISPASHARE_API_URL:-https://api.hispashare.org}
      PORT: 9118
      CACHE_TTL: ${CACHE_TTL:-600}
      RSS_CACHE_TTL: ${RSS_CACHE_TTL:-300}
      MAX_PAGES: ${MAX_PAGES:-2}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DOWNLOAD_CLIENT: mularr
      SOURCE_MAP: ${SOURCE_MAP:-Micro4K:WEBRip,MicroHD:WEBRip}
    ports:
      - "9118:9118"
    read_only: true
    security_opt:
      - no-new-privileges:true

  mularr:
    image: ghcr.io/joecarl/mularr:latest
    container_name: mularr
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      TZ: ${TZ:-Europe/Madrid}
      DATA_DIR: /app/data
      PORT: 8940
      AMULE_INCOMING_DIR: /downloads
      AMULE_TEMP_DIR: /downloads/temp
      # Con 0, Sonarr y Radarr mueven el archivo al importar en vez de copiarlo
      # (evita duplicar espacio al ser /downloads y /tv o /movies volúmenes distintos).
      SEED_RATIO_LIMIT: ${MULARR_SEED_RATIO_LIMIT:-0}
      SEED_TIME_LIMIT_MINUTES: ${MULARR_SEED_TIME_LIMIT_MINUTES:-0}
      AUTH_USERNAME: ${MULARR_USERNAME:-admin}
      AUTH_PASSWORD: ${MULARR_PASSWORD:?Falta MULARR_PASSWORD en .env}
      API_KEY: ${MULARR_API_KEY:-}
    ports:
      - "8940:8940"       # Interfaz web y API qBittorrent (/api/as-qbittorrent)
      - "4662:4662"       # ED2K TCP  (ábrelo en el router → High ID)
      - "4665:4665/udp"   # ED2K UDP  (búsquedas globales)
      - "4672:4672/udp"   # ED2K/Kad UDP (ábrelo en el router)
    volumes:
      - ./data/mularr:/app/data
      - ${DOWNLOADS:-./data/downloads}:/downloads
    stop_grace_period: 30s

  prowlarr:
    <<: *common
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    ports:
      - "9696:9696"
    volumes:
      - ./data/prowlarr:/config

  sonarr:
    <<: *common
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    ports:
      - "8989:8989"
    volumes:
      - ./data/sonarr:/config
      - ${DOWNLOADS:-./data/downloads}:/downloads
      - ${MEDIA_TV:?Falta MEDIA_TV en .env}:/tv

  radarr:
    <<: *common
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    ports:
      - "7878:7878"
    volumes:
      - ./data/radarr:/config
      - ${DOWNLOADS:-./data/downloads}:/downloads
      - ${MEDIA_MOVIES:?Falta MEDIA_MOVIES en .env}:/movies

  jellyfin:
    <<: *common
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      <<: *common-env
      JELLYFIN_PublishedServerUrl: ${JELLYFIN_URL:-http://orangepi5.local:8096}
    ports:
      - "8096:8096"         # Interfaz web
      - "7359:7359/udp"     # Descubrimiento en la red local (opcional)
    volumes:
      - ./data/jellyfin:/config
      - ${MEDIA_TV}:/data/tvshows:ro
      - ${MEDIA_MOVIES}:/data/movies:ro
    # Transcodificación por hardware del RK3588 (Orange Pi 5). Descomenta si
    # existen estos dispositivos (ls /dev/dri /dev/mpp_service /dev/rga /dev/dma_heap)
    # y activa «Rockchip MPP» en Jellyfin → Panel → Reproducción → Transcodificación.
    # devices:
    #   - /dev/dri:/dev/dri
    #   - /dev/dma_heap:/dev/dma_heap
    #   - /dev/mpp_service:/dev/mpp_service
    #   - /dev/rga:/dev/rga
    # security_opt:
    #   - systempaths=unconfined
    #   - apparmor=unconfined
